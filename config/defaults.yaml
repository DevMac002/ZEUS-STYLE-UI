# Editable defaults. Read as plain text if YAML parsing is unavailable.
workflow: guided
design_strategy: context_first
platform_detection: auto
supported_platforms:
  web:
    - HTML
    - CSS
    - JavaScript
    - React
    - Next.js
    - Vue
    - Nuxt
    - Svelte
  mobile:
    - Flutter
    - Dart
    - React Native
    - TypeScript
    - JavaScript
stack_detection: auto
implementation_scope: requested_only
design_system: reuse_or_create
dependency_policy: minimal
art_direction_count: adaptive
discovery:
  initial_questions: usually_1-3_if_materially_ambiguous
  ask_more_if: "Subject, object, purpose, audience, or constraints remain unclear enough to change the solution."
  avoid_questions_when_brief_is_clear: true
approval_required_for:
  - major_art_direction
  - broad_architecture_change
  - substantial_new_dependency
  - destructive_operation
  - scope_expansion
deliverables:
  analysis: when_useful
  concepts: adaptive
  design_system: when_useful
  implementation: when_requested
  tests_report: always_report_actual_checks
priority_order:
  - usability
  - visual_quality
  - project_fit
  - code_quality
  - accessibility
  - maintainability
  - performance
principle: "Visual distinction must serve the product and never override usability, accessibility, or correctness."

creative_frontier:
  consider_for: new_or_redesigned_experiences
  goal: distinctive_theme_specific_interaction_when_useful
  concepts: explore_three_distinct_mechanisms_internally
  default_presentation: one_recommended_direction
  limits: [usability, accessibility, reduced_motion, performance, project_scope]
